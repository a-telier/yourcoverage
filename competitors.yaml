competitors:
  - name: "Zara Home"
    instagram: "https://www.instagram.com/zarahome"
    website: "https://www.zarahome.com/se/"
    color: "#c4a35a"

  - name: "IKEA"
    instagram: "https://www.instagram.com/ikea"
    website: "https://www.ikea.com/se/sv/"
    color: "#0058a3"

  - name: "Maisons du Monde"
    instagram: "https://www.instagram.com/maisonsdumonde"
    website: "https://www.maisonsdumonde.com/FR/fr"
    color: "#d4a574"

  # Add up to 10 competitors total. Each needs:
  #   name:      Display name
  #   instagram: Full Instagram profile URL
  #   website:   Homepage URL (only index/home page is scraped)
  #   color:     Hex color for charts (optional, auto-assigned if omitted)

# Data collection settings
collection:
  weeks_to_keep: 52          # Store up to 52 weeks of data
  posts_per_profile: 20      # Fetch last N posts per collection
  download_thumbnails: true  # Save post thumbnail images locally
  website_screenshot: true   # Capture homepage screenshot

# Report settings
report:
  output_dir: "./docs"       # Where to write the HTML report
  default_weeks: "latest-4"  # Default week range for report (latest 4 weeks)
