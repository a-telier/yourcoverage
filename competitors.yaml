competitors:
  - name: "Zara Home"
    slug: "zarahome"
    website: "https://www.zarahome.com/se/"
    color: "#c4a35a"

  - name: "IKEA"
    slug: "ikea"
    website: "https://www.ikea.com/se/sv/"
    color: "#0058a3"

  - name: "Maisons du Monde"
    slug: "maisonsdumonde"
    website: "https://www.maisonsdumonde.com/FR/fr"
    color: "#d4a574"

  # Add more competitors:
  #   name:    Display name
  #   slug:    Short identifier (letters/numbers only)
  #   website: Homepage URL to scrape weekly
  #   color:   Hex color for the dashboard (optional)

# Collection settings
collection:
  weeks_to_keep: 52        # Keep up to 1 year of history
  screenshot: true         # Capture full-page homepage screenshot each week
  timeout: 30000           # Page load timeout in milliseconds

# Report settings
report:
  output_dir: "./docs"
  default_weeks: "latest-4"

# Database
database: "./data/yourcoverage.db"
