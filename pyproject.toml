[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yourcoverage"
version = "0.3.0"
description = "Website competitor content analysis tool for home/décor brands"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
browser = ["playwright>=1.40"]

[project.scripts]
yourcoverage = "yourcoverage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
